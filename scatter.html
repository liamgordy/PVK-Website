<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <title>Scatterplot</title>
  <link rel="stylesheet" href="styling.css">
</head>
<body onload="main()" class="page page-scatter">

  <nav>
    <a class="nav-logo" href="/">Preno<span>vation</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="scatter.html">Scatter Plot</a></li>
      <li><a href="treemap.html">Treemap</a></li>
    </ul>
  </nav>

  <div class="scatter-layout">
    <aside class="scatter-sidebar">
      <div class="scatter-university-list">
        <button class="control-button university-button active" onclick="selectUniversity(this, 'data/outputKTH.json')">
          <img class="university-logo" src="logos/logotype-blue-ff671d438dd60cb940a663d2fd5e0cf9.svg" alt="KTH logo">
          <span>KTH</span>
        </button>
        <button class="control-button university-button" onclick="selectUniversity(this, 'data/outputUpp.json')">
          <img class="university-logo" src="logos/Uppsala_University_logo.svg.png" alt="Uppsala University logo">
          <span>Uppsala University</span>
        </button>
        <button class="control-button university-button" onclick="selectUniversity(this, 'data/outputChal.json')">
          <img class="university-logo" src="logos/chalmers_c_logo.jpg" alt="Chalmers University logo">
          <span>Chalmers University</span>
        </button>
        <button class="control-button university-button" onclick="selectUniversity(this, 'data/outputKar.json')">
          <img class="university-logo" src="logos/images.jpeg" alt="Karolinska Institutet logo">
          <span>Karolinska Institutet</span>
        </button>
        <button class="control-button university-button" onclick="selectUniversity(this, 'data/outputLi.json')">
          <img class="university-logo" src="logos/site-logo.png" alt="Linköping University logo">
          <span>Linköping University</span>
        </button>
        <button class="control-button university-button" onclick="selectUniversity(this, 'data/outputSU.json')">
          <img class="university-logo" src="logos/images%20(1).jpeg" alt="Stockholm University logo">
          <span>Stockholm University</span>
        </button>
        <button class="control-button university-button" onclick="selectUniversity(this, 'data/outputLun.json')">
          <img class="university-logo" src="logos/Sigill_Lunds_universitet_(vit).png" alt="Lund University logo">
          <span>Lund University</span>
        </button>
      </div>
    </aside>

    <div class="scatter-content">
      <svg class="scatter-svg" width="1200" height="600"></svg>
    </div>

    <aside class="scatter-info">
      <div class="info-box">
        <h3>Graph explanation</h3>
        <p>Each circle is a paper from the selected university. The x/y positions reflect embedded semantic coordinates, colors show topic cluster, and circle size scales with citation count. Hover a point for title, year, and citations.</p>
      </div>
    </aside>
  </div>

  <script>
    let svg, g, tooltip;
    let dataset = [];

    function selectUniversity(button, file) {
      // Remove active class from all buttons
      document.querySelectorAll('.university-button').forEach(btn => {
        btn.classList.remove('active');
      });
      // Add active class to clicked button
      button.classList.add('active');
      // Load the file
      loadFile(file);
    }

    function main() {
      const width = 950, height = 600;
      svg = d3.select("svg")
        .attr("viewBox", [0, 0, width, height]);
      g = svg.append("g");

      tooltip = d3.select("body")
        .append("div")
        .attr("class", "tooltip");

      // Load default dataset
      loadFile("data/outputKTH.json");
    }

    function loadFile(file) {
      d3.json(file).then(data => {
        dataset = data;
        update();
      });
    }

    function update() {
      const width = 800, height = 600;
      g.selectAll("*").remove();

      const xScale = d3.scaleLinear()
        .domain(d3.extent(dataset, d => +d.x))
        .range([10, width - 40]);

      const yScale = d3.scaleLinear()
        .domain(d3.extent(dataset, d => +d.y))
        .range([height - 40, 40]);

      const sizeScale = d3.scaleSqrt()
        .domain(d3.extent(dataset, d => +d.cited_by_count))
        .range([4, 12]);

      const subGenres = Array.from(new Set(dataset.map(d => d["cluster"])));
      const color = d3.scaleOrdinal(d3.schemeTableau10).domain(subGenres);

      const points = g.selectAll("circle")
        .data(dataset, d => d.title);

      points.enter()
        .append("circle")
        .attr("cx", d => xScale(+d.x))
        .attr("cy", d => yScale(+d.y))
        .attr("r", 0)
        .attr("fill", d => color(d["cluster"]))
        .attr("opacity", 0.8)
        .on("mousemove", (e, d) => {
          tooltip
            .style("opacity", 1)
            .html(`
              <b>${d.title}</b><br>
              Topic: ${d["cluster"]}<br>
              Year: ${d.publication_year}<br>
              Citations: ${d.cited_by_count}
            `)
            .style("left", (e.pageX + 14) + "px")
            .style("top", (e.pageY + 14) + "px");
        })
        .on("mouseleave", () => tooltip.style("opacity", 0))
        .transition()
        .duration(600)
        .attr("r", d => sizeScale(+d.cited_by_count));

      const xAxis = d3.axisBottom(xScale);
      const yAxis = d3.axisLeft(yScale);

      g.append("g")
        .attr("transform", `translate(0,${height - 40})`)
        .call(xAxis);

      g.append("g")
        .attr("transform", `translate(40,0)`)
        .call(yAxis);

      svg.selectAll(".legend").remove();
      const legend = svg.append("g")
        .attr("class", "legend")
        .attr("transform", `translate(${width}, 40)`);

      subGenres.forEach((genre, i) => {
        const row = legend.append("g")
          .attr("transform", `translate(0, ${i * 25})`);
        row.append("rect")
          .attr("width", 18)
          .attr("height", 18)
          .attr("fill", color(genre));
        row.append("text")
          .attr("x", 24)
          .attr("y", 14)
          .text(genre)
          .style("font-size", "12px");
      });
    }
  </script>

</body>
</html>
